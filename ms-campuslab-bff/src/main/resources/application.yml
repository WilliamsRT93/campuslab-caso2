server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ms-campuslab-bff
  profiles:
    default: cognito

campuslab:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  downstream:
    catalog-url: ${CATALOG_URL:http://localhost:8081}
    bookings-url: ${BOOKINGS_URL:http://localhost:8082}
  cognito:
    client-id: ${COGNITO_CLIENT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: cognito
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
