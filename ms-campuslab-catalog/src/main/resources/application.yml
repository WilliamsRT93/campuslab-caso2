server:
  port: 8081

spring:
  application:
    name: ms-campuslab-catalog
  datasource:
    url: ${DB_URL:jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

# Mismos nombres que declara ms-campuslab-rabbitmq-admin (duena de la topologia).
# Este microservicio solo los referencia para publicar/consumir.
campuslab:
  rabbitmq:
    exchange: campuslab.exchange
    queue-auditoria: cola-auditoria
    routing-key-auditoria: reserva.auditoria

management:
  endpoints:
    web:
      exposure:
        include: health,info
