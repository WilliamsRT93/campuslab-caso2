server:
  port: 8082

spring:
  application:
    name: ms-campuslab-bookings
  datasource:
    url: jdbc:h2:mem:bookings;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
