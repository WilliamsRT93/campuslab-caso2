server:
  port: 8082

spring:
  application:
    name: ms-campuslab-bookings
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bookings;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

# Nombres de exchange/colas/routing-keys CENTRALIZADOS (misma topologia que declara
# ms-campuslab-rabbitmq-admin -- este microservicio NO vuelve a declarar colas/exchanges,
# solo publica y consume usando estos nombres).
campuslab:
  rabbitmq:
    exchange: campuslab.exchange
    # Reintentos de errores recuperables antes de enviar el mensaje a la DLQ (ManejadorErroresListener)
    max-reintentos: 3
    espera-reintento-ms: 1000
    queue-notificaciones: cola-notificaciones
    queue-documentos: cola-documentos
    routing-key-notificaciones: reserva.notificacion
    routing-key-documentos: reserva.documento

management:
  endpoints:
    web:
      exposure:
        include: health,info
