server:
  port: 8086

spring:
  application:
    name: ms-campuslab-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

# Nombres de exchange/colas/routing-keys CENTRALIZADOS (misma topologia que declara
# ms-campuslab-rabbitmq-admin -- este microservicio NO vuelve a declarar colas/exchanges,
# solo consume usando estos nombres). Unico consumidor de notificaciones, documentos,
# auditoria y los eventos de dominio (reserva.# / catalogo.#) -- bookings y catalog
# SOLO publican (regla de diseno: productor y consumidor nunca son el mismo servicio).
campuslab:
  rabbitmq:
    exchange: campuslab.exchange
    # Reintentos de errores recuperables antes de enviar el mensaje a la DLQ (ManejadorErroresListener)
    max-reintentos: 3
    espera-reintento-ms: 1000
    queue-notificaciones: cola-notificaciones
    queue-documentos: cola-documentos
    queue-auditoria: cola-auditoria
    routing-key-notificaciones: reserva.notificacion
    routing-key-documentos: reserva.documento
    routing-key-auditoria: reserva.auditoria
    # Exchange TOPIC (lo declara el administrador): eventos enrutados por patron
    topic-exchange: campuslab.eventos
    queue-eventos-reservas: cola-eventos-reservas
    queue-eventos-catalogo: cola-eventos-catalogo
    routing-key-evento-reserva: reserva.creada
    routing-key-evento-catalogo: catalogo.producto

management:
  endpoints:
    web:
      exposure:
        include: health,info
