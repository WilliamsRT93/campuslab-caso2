AWSTemplateFormatVersion: '2010-09-09'
Description: >
  API Gateway (HTTP API) de CampusLab definido como infraestructura como codigo
  (EP3: rutas gestionadas con CloudFormation, sin proxy generico). Cada recurso y
  verbo tiene su ruta explicita, protegida con el autorizador JWT de Cognito, y su
  integracion hacia el BFF. Para cambiar de backend solo se actualiza el
  parametro BackendBaseUrl y se vuelve a desplegar el stack.

Parameters:
  BackendBaseUrl:
    Type: String
    Description: URL base del BFF, sin ruta ni proxy (http://<IP-elastica-EC2>:8080).
    Default: http://100.60.125.97:8080

  FrontendOriginNube:
    Type: String
    Description: Origen HTTPS del frontend desplegado en la EC2.
    Default: https://100.60.125.97

  FrontendOriginLocal:
    Type: String
    Description: Origen del frontend corriendo local (npm run dev).
    Default: http://localhost:5173

  CognitoIssuer:
    Type: String
    Default: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_dBOQeniQq

  CognitoClientId:
    Type: String
    Default: 6r3af8ucc96okla0ujph9pru4a

Resources:

  CampusLabHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: campuslab-http-api-cfn
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOriginNube
          - !Ref FrontendOriginLocal
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]

  CognitoJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref CampusLabHttpApi
      AuthorizerType: JWT
      Name: cognito-jwt-cfn
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref CognitoClientId
        Issuer: !Ref CognitoIssuer

  # ---------------- Integraciones (una por recurso, sin proxy) ----------------
  IntMe:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/me'
      PayloadFormatVersion: '1.0'

  IntCatalog:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/catalog/resources'
      PayloadFormatVersion: '1.0'

  IntCatalogItem:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/catalog/resources/{id}'
      PayloadFormatVersion: '1.0'

  IntBookings:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/bookings'
      PayloadFormatVersion: '1.0'

  IntBookingsItem:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/bookings/{id}'
      PayloadFormatVersion: '1.0'

  IntBookingsStatus:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/bookings/{id}/status'
      PayloadFormatVersion: '1.0'

  # ---------------- Rutas explicitas ----------------
  RouteMeGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/me
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntMe]]

  RouteCatalogGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/catalog/resources
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntCatalog]]

  RouteCatalogPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: POST /api/catalog/resources
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntCatalog]]

  RouteCatalogItemGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/catalog/resources/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntCatalogItem]]

  RouteCatalogItemPut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: PUT /api/catalog/resources/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntCatalogItem]]

  RouteCatalogItemDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: DELETE /api/catalog/resources/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntCatalogItem]]

  RouteBookingsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/bookings
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookings]]

  RouteBookingsPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: POST /api/bookings
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookings]]

  RouteBookingsItemGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/bookings/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookingsItem]]

  RouteBookingsItemPut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: PUT /api/bookings/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookingsItem]]

  RouteBookingsItemDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: DELETE /api/bookings/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookingsItem]]

  RouteBookingsStatusPut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: PUT /api/bookings/{id}/status
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookingsStatus]]

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref CampusLabHttpApi
      StageName: $default
      AutoDeploy: true

Outputs:
  ApiEndpoint:
    Description: URL base del API Gateway
    Value: !Sub https://${CampusLabHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiId:
    Value: !Ref CampusLabHttpApi
