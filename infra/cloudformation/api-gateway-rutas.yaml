AWSTemplateFormatVersion: '2010-09-09'
Description: >
  API Gateway (HTTP API) de CampusLab definido como infraestructura como codigo
  (EP3: rutas gestionadas con CloudFormation, sin proxy generico). Cada recurso y
  verbo tiene su ruta explicita, protegida con el autorizador JWT de Cognito, y su
  integracion hacia el BFF. Para cambiar de backend solo se actualiza el
  parametro BackendBaseUrl y se vuelve a desplegar el stack.

Parameters:
  BackendBaseUrl:
    Type: String
    Description: URL base del BFF, sin ruta ni proxy (http://<IP-elastica-EC2>:8080).
    Default: http://100.60.125.97:8080

  RabbitAdminBaseUrl:
    Type: String
    Description: URL base del administrador de RabbitMQ (http://<IP-elastica-EC2-RabbitMQ>:8083), sin ruta.
    Default: http://54.208.235.239:8083

  KafkaAdminBaseUrl:
    Type: String
    Description: URL base del administrador de Kafka (EP3, http://<IP-elastica-EC2-Kafka>:8084), sin ruta.
    Default: http://54.164.1.235:8084

  ReporteriaBaseUrl:
    Type: String
    Description: URL base del panel de reporteria/auditoria (EP5, http://<IP-elastica-EC2-Kafka>:8085), sin ruta.
    Default: http://54.164.1.235:8085

  FrontendOriginNube:
    Type: String
    Description: Origen HTTPS del frontend desplegado en la EC2.
    Default: https://100.60.125.97

  FrontendOriginLocal:
    Type: String
    Description: Origen del frontend corriendo local (npm run dev).
    Default: http://localhost:5173

  CognitoIssuer:
    Type: String
    Default: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_dBOQeniQq

  CognitoClientId:
    Type: String
    Default: 6r3af8ucc96okla0ujph9pru4a

Resources:

  CampusLabHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: campuslab-http-api-cfn
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOriginNube
          - !Ref FrontendOriginLocal
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]

  CognitoJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref CampusLabHttpApi
      AuthorizerType: JWT
      Name: cognito-jwt-cfn
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref CognitoClientId
        Issuer: !Ref CognitoIssuer

  # ---------------- Integraciones (una por recurso, sin proxy) ----------------
  IntMe:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/me'
      PayloadFormatVersion: '1.0'

  IntCatalog:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/catalog/resources'
      PayloadFormatVersion: '1.0'

  IntCatalogItem:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/catalog/resources/{id}'
      PayloadFormatVersion: '1.0'

  IntBookings:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/bookings'
      PayloadFormatVersion: '1.0'

  IntBookingsItem:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/bookings/{id}'
      PayloadFormatVersion: '1.0'

  IntBookingsStatus:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${BackendBaseUrl}/api/bookings/{id}/status'
      PayloadFormatVersion: '1.0'

  # ---------------- Rutas explicitas ----------------
  RouteMeGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/me
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntMe]]

  RouteCatalogGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/catalog/resources
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntCatalog]]

  RouteCatalogPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: POST /api/catalog/resources
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntCatalog]]

  RouteCatalogItemGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/catalog/resources/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntCatalogItem]]

  RouteCatalogItemPut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: PUT /api/catalog/resources/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntCatalogItem]]

  RouteCatalogItemDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: DELETE /api/catalog/resources/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntCatalogItem]]

  RouteBookingsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/bookings
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookings]]

  RouteBookingsPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: POST /api/bookings
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookings]]

  RouteBookingsItemGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/bookings/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookingsItem]]

  RouteBookingsItemPut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: PUT /api/bookings/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookingsItem]]

  RouteBookingsItemDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: DELETE /api/bookings/{id}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookingsItem]]

  RouteBookingsStatusPut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: PUT /api/bookings/{id}/status
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntBookingsStatus]]

  # ---------------- Prueba de mensajeria (front -> administrador de RabbitMQ) ----------------
  IntRabbitTopologia:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${RabbitAdminBaseUrl}/api/rabbitmq/topologia'

  IntRabbitPublicar:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${RabbitAdminBaseUrl}/api/rabbitmq/publicar'

  RouteRabbitTopologiaGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/rabbitmq/topologia
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntRabbitTopologia]]

  RouteRabbitPublicarPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: POST /api/rabbitmq/publicar
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntRabbitPublicar]]

  # ---------------- EP5: administrador de Kafka (front -> ms-campuslab-kafka-admin) ----------------
  IntKafkaTopics:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${KafkaAdminBaseUrl}/api/kafka/topics'

  IntKafkaTopicItem:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${KafkaAdminBaseUrl}/api/kafka/topics/{nombre}'

  IntKafkaTopicConfig:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${KafkaAdminBaseUrl}/api/kafka/topics/{nombre}/config'

  IntKafkaTopicParticiones:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${KafkaAdminBaseUrl}/api/kafka/topics/{nombre}/particiones'

  IntKafkaConsumerGroups:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${KafkaAdminBaseUrl}/api/kafka/consumer-groups'

  IntKafkaConsumerGroupItem:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${KafkaAdminBaseUrl}/api/kafka/consumer-groups/{groupId}'

  RouteKafkaTopicsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/kafka/topics
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntKafkaTopics]]

  RouteKafkaTopicsPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: POST /api/kafka/topics
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntKafkaTopics]]

  RouteKafkaTopicItemGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/kafka/topics/{nombre}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntKafkaTopicItem]]

  RouteKafkaTopicItemDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: DELETE /api/kafka/topics/{nombre}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntKafkaTopicItem]]

  RouteKafkaTopicConfigPatch:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: PATCH /api/kafka/topics/{nombre}/config
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntKafkaTopicConfig]]

  RouteKafkaTopicParticionesPatch:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: PATCH /api/kafka/topics/{nombre}/particiones
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntKafkaTopicParticiones]]

  RouteKafkaConsumerGroupsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/kafka/consumer-groups
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntKafkaConsumerGroups]]

  RouteKafkaConsumerGroupItemGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/kafka/consumer-groups/{groupId}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntKafkaConsumerGroupItem]]

  IntKafkaPrueba:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${KafkaAdminBaseUrl}/api/kafka/prueba/publicar'

  RouteKafkaPruebaPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: POST /api/kafka/prueba/publicar
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntKafkaPrueba]]

  # ---------------- EP5: panel de reporteria/auditoria (front -> ms-campuslab-reporteria) ----------------
  IntReporteriaVentas:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${ReporteriaBaseUrl}/api/reporteria/ventas'

  IntReporteriaAuditoria:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CampusLabHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub '${ReporteriaBaseUrl}/api/reporteria/auditoria'

  RouteReporteriaVentasGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/reporteria/ventas
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntReporteriaVentas]]

  RouteReporteriaAuditoriaGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CampusLabHttpApi
      RouteKey: GET /api/reporteria/auditoria
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Join ['/', ['integrations', !Ref IntReporteriaAuditoria]]

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref CampusLabHttpApi
      StageName: $default
      AutoDeploy: true

Outputs:
  ApiEndpoint:
    Description: URL base del API Gateway
    Value: !Sub https://${CampusLabHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiId:
    Value: !Ref CampusLabHttpApi
